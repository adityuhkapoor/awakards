<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Awakards — Compile .mind Targets</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; color: #fff; font-family: system-ui, sans-serif; padding: 24px; }
    h1 { font-size: 20px; margin-bottom: 8px; color: #ffaa00; }
    .info { color: #888; font-size: 13px; margin-bottom: 24px; }
    #previews { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    #previews canvas { border: 1px solid #333; border-radius: 8px; }
    #log { background: #0a0a0a; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 12px; color: #6f6; min-height: 120px; max-height: 400px; overflow-y: auto; white-space: pre-wrap; }
    button { background: #ffaa00; color: #000; border: none; padding: 12px 24px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; margin-bottom: 16px; }
    button:disabled { opacity: 0.4; cursor: default; }
    a { color: #ffaa00; }
  </style>
</head>
<body>

<h1>Compile .mind Targets</h1>
<p class="info">
  Generates 5 high-contrast, feature-dense card images (1000x1400) and compiles them into <code>targets.mind</code>.<br>
  Target order: 0=P1 Monster, 1=P2 Monster, 2=Basic Attack, 3=Special Attack, 4=Ultimate Attack
</p>

<button id="compile-btn">Generate & Compile</button>
<div id="previews"></div>
<div id="log"></div>

<script type="module">
import { Compiler } from 'https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js';

const CARDS = [
  // Each card has digital + photo variant for redundant tracking
  // Target order: 0=P1(dig), 1=P1(photo), 2=P2(dig), 3=P2(photo), 4=Basic(dig), 5=Basic(photo), 6=Special(dig), 7=Special(photo), 8=Ult(dig), 9=Ult(photo)
  { label: 'P1 MONSTER',         bg: '#f0f0e8', fg: '#1a6b1a', accent: '#0d4d0d', shape: 'diamond',  seed: 1 },
  { label: 'P1 MONSTER (PHOTO)', bg: '#f0f0e8', fg: '#1a6b1a', accent: '#0d4d0d', shape: 'diamond',  seed: 1, photoOverride: 'targets/p1-monster-photo.png' },
  { label: 'P2 MONSTER',         bg: '#e8e8f0', fg: '#1a1a8b', accent: '#0d0d6b', shape: 'hexagon',  seed: 2 },
  { label: 'P2 MONSTER (PHOTO)', bg: '#e8e8f0', fg: '#1a1a8b', accent: '#0d0d6b', shape: 'hexagon',  seed: 2, photoOverride: 'targets/p2-monster-photo.png' },
  { label: 'BASIC ATTACK',         bg: '#f0ece0', fg: '#994400', accent: '#6b2e00', shape: 'triangle', seed: 3 },
  { label: 'BASIC ATTACK (PHOTO)', bg: '#f0ece0', fg: '#994400', accent: '#6b2e00', shape: 'triangle', seed: 3, photoOverride: 'targets/basic-attack-photo.png' },
  { label: 'SPECIAL ATTACK',         bg: '#e0ecf0', fg: '#006688', accent: '#004466', shape: 'star',     seed: 4 },
  { label: 'SPECIAL ATTACK (PHOTO)', bg: '#e0ecf0', fg: '#006688', accent: '#004466', shape: 'star',     seed: 4, photoOverride: 'targets/special-attack-photo.png' },
  { label: 'ULTIMATE',         bg: '#f0e0ea', fg: '#8b1a55', accent: '#6b0d3d', shape: 'burst',    seed: 5 },
  { label: 'ULTIMATE (PHOTO)', bg: '#f0e0ea', fg: '#8b1a55', accent: '#6b0d3d', shape: 'burst',    seed: 5, photoOverride: 'targets/ultimate-attack-photo.png' },
];

const W = 1000, H = 1400;

// Simple seeded PRNG for reproducible patterns
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function drawCard(card) {
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  const rng = mulberry32(card.seed * 7919);

  // Solid dark background
  ctx.fillStyle = card.bg;
  ctx.fillRect(0, 0, W, H);

  // LAYER 1: Dense scattered micro-shapes for feature points everywhere
  // These create lots of unique, non-repeating edge features across the entire canvas
  for (let i = 0; i < 400; i++) {
    const x = rng() * W;
    const y = rng() * H;
    const size = 3 + rng() * 12;
    const type = Math.floor(rng() * 5);
    ctx.fillStyle = rng() > 0.5 ? card.fg + '66' : card.accent + '55';
    ctx.strokeStyle = rng() > 0.5 ? card.fg + '88' : card.accent + '77';
    ctx.lineWidth = 1 + rng() * 2;

    switch (type) {
      case 0: // small square
        ctx.fillRect(x, y, size, size);
        break;
      case 1: // small circle
        ctx.beginPath(); ctx.arc(x, y, size / 2, 0, Math.PI * 2); ctx.stroke();
        break;
      case 2: // small triangle
        ctx.beginPath();
        ctx.moveTo(x, y - size); ctx.lineTo(x + size, y + size); ctx.lineTo(x - size, y + size);
        ctx.closePath(); ctx.stroke();
        break;
      case 3: // cross
        ctx.beginPath();
        ctx.moveTo(x - size, y); ctx.lineTo(x + size, y);
        ctx.moveTo(x, y - size); ctx.lineTo(x, y + size);
        ctx.stroke();
        break;
      case 4: // dot cluster
        for (let d = 0; d < 3; d++) {
          ctx.beginPath();
          ctx.arc(x + rng() * 10 - 5, y + rng() * 10 - 5, 2, 0, Math.PI * 2);
          ctx.fill();
        }
        break;
    }
  }

  // LAYER 2: Asymmetric line patterns (unique per card, sharp edges)
  ctx.lineWidth = 2;
  ctx.strokeStyle = card.fg + '77';
  const lineCount = 30 + Math.floor(rng() * 20);
  for (let i = 0; i < lineCount; i++) {
    const x1 = rng() * W, y1 = rng() * H;
    const x2 = x1 + (rng() - 0.5) * 300, y2 = y1 + (rng() - 0.5) * 300;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }

  // LAYER 3: Edge tick marks (features at borders for partial-occlusion tracking)
  ctx.strokeStyle = card.fg + 'aa';
  ctx.lineWidth = 3;
  for (let x = 20; x < W; x += 15 + Math.floor(rng() * 20)) {
    const len = 8 + rng() * 20;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, len); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, H); ctx.lineTo(x, H - len); ctx.stroke();
  }
  for (let y = 20; y < H; y += 15 + Math.floor(rng() * 20)) {
    const len = 8 + rng() * 20;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(len, y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W, y); ctx.lineTo(W - len, y); ctx.stroke();
  }

  // LAYER 4: Corner markers (strong asymmetric features in all 4 corners)
  const corners = [[30, 30], [W - 30, 30], [30, H - 30], [W - 30, H - 30]];
  const cornerSymbols = ['◆', '●', '▲', '■'];
  ctx.font = 'bold 36px monospace';
  corners.forEach((pos, ci) => {
    ctx.fillStyle = card.fg;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(cornerSymbols[ci], pos[0], pos[1]);
    // Unique number near corner
    ctx.font = 'bold 18px monospace';
    ctx.fillStyle = card.accent;
    ctx.fillText(String(card.seed * 10 + ci), pos[0] + (ci % 2 === 0 ? 30 : -30), pos[1]);
    ctx.font = 'bold 36px monospace';
  });

  // LAYER 5: Multiple decorative borders (strong trackable edges)
  ctx.strokeStyle = card.fg;
  ctx.lineWidth = 5;
  ctx.beginPath(); ctx.roundRect(10, 10, W - 20, H - 20, 20); ctx.stroke();
  ctx.strokeStyle = card.accent;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(22, 22, W - 44, H - 44, 16); ctx.stroke();
  ctx.strokeStyle = card.fg + '88';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(32, 32, W - 64, H - 64, 12); ctx.stroke();

  // LAYER 6: Prominent center shape (large, filled, high contrast)
  const cx = W / 2, cy = H / 2 - 40;
  ctx.fillStyle = card.fg;
  ctx.strokeStyle = card.accent;
  ctx.lineWidth = 4;

  switch (card.shape) {
    case 'diamond': {
      const s = 160;
      ctx.beginPath();
      ctx.moveTo(cx, cy - s); ctx.lineTo(cx + s * 0.75, cy);
      ctx.lineTo(cx, cy + s); ctx.lineTo(cx - s * 0.75, cy);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      // Inner detail
      ctx.strokeStyle = card.bg;
      ctx.lineWidth = 3;
      const s2 = s * 0.5;
      ctx.beginPath();
      ctx.moveTo(cx, cy - s2); ctx.lineTo(cx + s2 * 0.75, cy);
      ctx.lineTo(cx, cy + s2); ctx.lineTo(cx - s2 * 0.75, cy);
      ctx.closePath(); ctx.stroke();
      break;
    }
    case 'hexagon': {
      const r = 150;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = Math.PI / 3 * i - Math.PI / 6;
        ctx.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a));
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      // Inner hexagon
      ctx.strokeStyle = card.bg;
      ctx.lineWidth = 3;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = Math.PI / 3 * i;
        ctx.lineTo(cx + r * 0.5 * Math.cos(a), cy + r * 0.5 * Math.sin(a));
      }
      ctx.closePath(); ctx.stroke();
      break;
    }
    case 'triangle': {
      const s = 170;
      ctx.beginPath();
      ctx.moveTo(cx, cy - s); ctx.lineTo(cx + s * 0.9, cy + s * 0.6); ctx.lineTo(cx - s * 0.9, cy + s * 0.6);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = card.bg;
      ctx.lineWidth = 3;
      const s2 = s * 0.45;
      ctx.beginPath();
      ctx.moveTo(cx, cy - s2); ctx.lineTo(cx + s2 * 0.9, cy + s2 * 0.6); ctx.lineTo(cx - s2 * 0.9, cy + s2 * 0.6);
      ctx.closePath(); ctx.stroke();
      break;
    }
    case 'star': {
      const outer = 150, inner = 60;
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const a = Math.PI / 5 * i - Math.PI / 2;
        const r = i % 2 === 0 ? outer : inner;
        ctx.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a));
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      // Center dot
      ctx.fillStyle = card.bg;
      ctx.beginPath(); ctx.arc(cx, cy, 20, 0, Math.PI * 2); ctx.fill();
      break;
    }
    case 'burst': {
      const outer = 160, inner = 70;
      ctx.beginPath();
      for (let i = 0; i < 24; i++) {
        const a = Math.PI / 12 * i - Math.PI / 2;
        const r = i % 2 === 0 ? outer : inner;
        ctx.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a));
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      // Inner ring
      ctx.strokeStyle = card.bg;
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(cx, cy, 45, 0, Math.PI * 2); ctx.stroke();
      break;
    }
  }

  // LAYER 7: Scattered unique glyphs (breaks repetition, adds asymmetry)
  const glyphs = ['⚡', '★', '◇', '⬡', '⊕', '△', '⬟', '☆', '⊗', '⬢', '✦', '◈'];
  ctx.font = '20px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let i = 0; i < 25; i++) {
    const x = 60 + rng() * (W - 120);
    const y = 60 + rng() * (H - 120);
    // Skip if too close to center shape
    if (Math.abs(x - cx) < 180 && Math.abs(y - cy) < 200) continue;
    ctx.fillStyle = (rng() > 0.5 ? card.fg : card.accent) + '99';
    ctx.fillText(glyphs[Math.floor(rng() * glyphs.length)], x, y);
  }

  // LAYER 8: Label text (large, high contrast)
  ctx.fillStyle = card.fg;
  ctx.font = 'bold 56px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(card.label, cx, H - 140);

  // Subtitle with unique ID
  ctx.font = 'bold 22px monospace';
  ctx.fillStyle = card.accent + 'cc';
  ctx.fillText('AWK-' + card.shape.toUpperCase() + '-' + card.seed, cx, H - 90);

  // LAYER 9: Additional asymmetric marks along sides
  ctx.fillStyle = card.fg + 'cc';
  ctx.font = 'bold 14px monospace';
  ctx.textAlign = 'left';
  for (let y = 80; y < H - 80; y += 100 + Math.floor(rng() * 60)) {
    ctx.fillText(String(Math.floor(rng() * 999)).padStart(3, '0'), 40, y);
  }
  ctx.textAlign = 'right';
  for (let y = 120; y < H - 80; y += 100 + Math.floor(rng() * 60)) {
    ctx.fillText(String(Math.floor(rng() * 999)).padStart(3, '0'), W - 40, y);
  }

  return c;
}

const logEl = document.getElementById('log');
function log(msg) {
  logEl.textContent += msg + '\n';
  logEl.scrollTop = logEl.scrollHeight;
}

document.getElementById('compile-btn').addEventListener('click', async () => {
  const btn = document.getElementById('compile-btn');
  btn.disabled = true;
  document.getElementById('previews').replaceChildren();
  logEl.textContent = '';

  log('Generating 5 feature-dense card images (1000x1400)...');
  const canvases = [];
  for (let i = 0; i < CARDS.length; i++) {
    const card = CARDS[i];
    let c;
    if (card.photoOverride) {
      log(`  [${i}] ${card.label} — loading photo override: ${card.photoOverride}`);
      const img = await new Promise((resolve, reject) => {
        const el = new Image();
        el.onload = () => resolve(el);
        el.onerror = () => { log(`    WARN: photo load failed, falling back to generated`); resolve(null); };
        el.src = card.photoOverride;
      });
      if (img) {
        c = document.createElement('canvas');
        c.width = W; c.height = H;
        c.getContext('2d').drawImage(img, 0, 0, W, H);
      } else {
        c = drawCard(card);
      }
    } else {
      c = drawCard(card);
    }
    const preview = document.createElement('canvas');
    preview.width = 150; preview.height = 210;
    preview.title = `Target ${i}: ${card.label}`;
    preview.getContext('2d').drawImage(c, 0, 0, 150, 210);
    document.getElementById('previews').appendChild(preview);
    log(`  [${i}] ${card.label} — ${W}x${H}${card.photoOverride ? ' (PHOTO)' : ''}`);
    canvases.push(c);
  }

  log('\nConverting to ImageBitmap...');
  const images = [];
  for (const c of canvases) {
    const blob = await new Promise(r => c.toBlob(r, 'image/png'));
    images.push(await createImageBitmap(blob));
  }
  log(`  ${images.length} images ready`);

  log('\nCompiling .mind file (this takes 30-90s at higher resolution)...');
  try {
    const compiler = new Compiler();
    let lastPct = -1;
    await compiler.compileImageTargets(images, (progress) => {
      // MindAR reports per-target progress (0-1 per image, not overall)
      const pct = Math.min(Math.round(progress * 100 / images.length), 100);
      if (pct > lastPct) { log(`  Progress: ${pct}%`); lastPct = pct; }
    });
    log('Compilation complete! Exporting...');

    const buffer = await compiler.exportData();
    const blob = new Blob([buffer]);
    log(`  .mind file size: ${(blob.size / 1024).toFixed(1)} KB`);

    // Download .mind
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'targets.mind';
    a.textContent = 'Download targets.mind';
    a.style.cssText = 'display:block;margin-top:12px;color:#ffaa00;font-size:16px;font-weight:700;';
    logEl.after(a);
    a.click();
    log('\nDone! targets.mind downloaded.');

    // Download individual PNGs
    log('\nDownloading individual card PNGs...');
    const names = ['p1-monster', 'p2-monster', 'basic-attack', 'special-attack', 'ultimate-attack'];
    for (let i = 0; i < canvases.length; i++) {
      const pngBlob = await new Promise(r => canvases[i].toBlob(r, 'image/png'));
      const pngUrl = URL.createObjectURL(pngBlob);
      const dl = document.createElement('a');
      dl.href = pngUrl; dl.download = names[i] + '.png';
      dl.click();
      URL.revokeObjectURL(pngUrl);
      log(`  Downloaded ${names[i]}.png`);
      // Small delay to avoid Chrome blocking rapid downloads
      await new Promise(r => setTimeout(r, 300));
    }
  } catch (err) {
    log('\nERROR: ' + err.message);
    console.error(err);
  }

  btn.disabled = false;
});
</script>
</body>
</html>
