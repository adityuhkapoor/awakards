<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Awakards</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111; color: #fff; font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      padding: 40px 20px;
    }

    h1 {
      font-size: 36px; font-weight: 900; letter-spacing: 2px;
      background: linear-gradient(135deg, #ffaa00, #ff6600);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .subtitle { color: #888; font-size: 14px; margin-bottom: 36px; }

    .cards-row { display: flex; gap: 20px; width: 100%; max-width: 500px; margin-bottom: 32px; }

    .card-slot {
      flex: 1; background: #1a1a1a; border: 2px dashed #333; border-radius: 16px;
      padding: 20px 12px; text-align: center; min-height: 220px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: border-color 0.3s;
    }
    .card-slot.filled { border-style: solid; }
    .card-slot .slot-label { font-size: 12px; color: #666; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }

    .card-slot .empty-icon { font-size: 40px; color: #333; margin-bottom: 8px; }
    .card-slot .empty-text { font-size: 13px; color: #555; }

    .card-preview-portrait {
      width: 80px; height: 80px; border-radius: 10px; object-fit: cover;
      border: 2px solid #333; margin-bottom: 8px; background: #222;
    }
    .card-preview-name { font-size: 16px; font-weight: 700; color: #ffaa00; }
    .card-preview-type { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
    .card-preview-hp { font-size: 13px; color: #aaa; margin-top: 6px; }

    .btn {
      display: inline-block; padding: 14px 28px; border: none; border-radius: 14px;
      font-size: 15px; font-weight: 700; cursor: pointer; text-decoration: none;
      color: #fff; text-align: center; transition: transform 0.1s, opacity 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(0.95); }

    .btn-create {
      background: linear-gradient(135deg, #333, #222); width: 100%; margin-top: 10px;
      font-size: 13px; padding: 10px 16px;
    }
    .btn-create:hover { background: linear-gradient(135deg, #444, #333); }

    .btn-battle {
      background: linear-gradient(135deg, #ffaa00, #ff6600);
      width: 100%; max-width: 500px; font-size: 18px; margin-bottom: 16px;
      box-shadow: 0 4px 20px rgba(255, 170, 0, 0.3);
    }
    .btn-battle:disabled {
      background: linear-gradient(135deg, #333, #222);
      box-shadow: none; opacity: 0.5; cursor: not-allowed;
    }
    .btn-battle:disabled:active { transform: none; }

    .btn-clear {
      background: none; border: 1px solid #333; color: #666; font-size: 12px;
      padding: 8px 20px;
    }

    .btn-targets {
      background: none; border: none; color: #555; font-size: 12px;
      padding: 8px 20px; margin-top: 8px; cursor: pointer; text-decoration: underline;
    }

    .actions { width: 100%; max-width: 500px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  </style>
</head>
<body>

<h1>AWAKARDS</h1>
<p class="subtitle">Draw monsters. Forge cards. Battle in AR.</p>

<div class="cards-row">
  <div class="card-slot" id="slot-p1">
    <div class="slot-label">Player 1</div>
    <div class="empty-icon">?</div>
    <div class="empty-text">No card yet</div>
    <a href="create.html?player=1" class="btn btn-create">Create Card</a>
  </div>
  <div class="card-slot" id="slot-p2">
    <div class="slot-label">Player 2</div>
    <div class="empty-icon">?</div>
    <div class="empty-text">No card yet</div>
    <a href="create.html?player=2" class="btn btn-create">Create Card</a>
  </div>
</div>

<div class="actions">
  <a href="battle.html" class="btn btn-battle" id="battle-btn" disabled>START BATTLE</a>
  <button class="btn btn-clear" id="clear-btn">Clear All Cards</button>
  <button class="btn-targets" id="targets-btn">Print AR Target Cards</button>
</div>

<script>
const TYPE_COLORS = {
  fire: '#ff4400', ice: '#0099ff', lightning: '#ffcc00', shadow: '#8833cc', nature: '#22cc44'
};

function renderSlot(slotId, playerNum) {
  const slot = document.getElementById(slotId);
  const data = localStorage.getItem(`awakards_p${playerNum}`);

  if (!data) {
    slot.className = 'card-slot';
    slot.innerHTML = `
      <div class="slot-label">Player ${playerNum}</div>
      <div class="empty-icon">?</div>
      <div class="empty-text">No card yet</div>
      <a href="create.html?player=${playerNum}" class="btn btn-create">Create Card</a>
    `;
    return false;
  }

  const card = JSON.parse(data);
  const typeColor = TYPE_COLORS[card.type] || '#888';
  slot.className = 'card-slot filled';
  slot.style.borderColor = typeColor;

  const portraitHtml = card.portrait
    ? `<img class="card-preview-portrait" src="${card.portrait}" alt="${card.name}">`
    : `<div class="card-preview-portrait" style="display:flex;align-items:center;justify-content:center;color:#555;font-size:11px;">No art</div>`;

  slot.innerHTML = `
    <div class="slot-label">Player ${playerNum}</div>
    ${portraitHtml}
    <div class="card-preview-name">${card.name || 'Unknown'}</div>
    <div class="card-preview-type" style="color:${typeColor}">${card.type || 'unknown'} type</div>
    <div class="card-preview-hp">HP: ${card.hp || '?'} | ATK: ${card.attack || '?'}</div>
    <a href="create.html?player=${playerNum}" class="btn btn-create">Recreate Card</a>
  `;
  return true;
}

function refresh() {
  const p1Ready = renderSlot('slot-p1', 1);
  const p2Ready = renderSlot('slot-p2', 2);

  const battleBtn = document.getElementById('battle-btn');
  if (p1Ready && p2Ready) {
    battleBtn.removeAttribute('disabled');
    battleBtn.style.pointerEvents = 'auto';
  } else {
    battleBtn.setAttribute('disabled', '');
    battleBtn.style.pointerEvents = 'none';
  }
}

document.getElementById('clear-btn').addEventListener('click', () => {
  localStorage.removeItem('awakards_p1');
  localStorage.removeItem('awakards_p2');
  refresh();
});

document.getElementById('targets-btn').addEventListener('click', () => {
  window.location.href = 'cards.html';
});

// Prevent navigation when battle button is disabled
document.getElementById('battle-btn').addEventListener('click', (e) => {
  if (e.target.hasAttribute('disabled')) {
    e.preventDefault();
  }
});

refresh();
</script>
</body>
</html>
