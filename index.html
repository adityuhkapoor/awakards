<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Awakards</title>

  <!-- Remote log relay: captures console.* and POSTs to server for Claude to read -->
  <script>
  (function() {
    const Q = [];
    let timer = null;
    function flush() {
      if (!Q.length) return;
      const batch = Q.splice(0, 50);
      fetch('/log', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(batch) }).catch(() => {});
    }
    function hook(level) {
      const orig = console[level].bind(console);
      console[level] = function(...args) {
        orig(...args);
        Q.push({ level, msg: args.map(a => {
          try { return typeof a === 'object' ? JSON.stringify(a) : String(a); }
          catch { return String(a); }
        }).join(' ') });
        clearTimeout(timer);
        timer = setTimeout(flush, 300);
      };
    }
    ['log','warn','error','info'].forEach(hook);
    window.addEventListener('error', e => {
      Q.push({ level: 'error', msg: e.message + ' at ' + e.filename + ':' + e.lineno });
      flush();
    });
    window.addEventListener('unhandledrejection', e => {
      Q.push({ level: 'error', msg: 'Unhandled rejection: ' + e.reason });
      flush();
    });
  })();
  </script>

  <!-- Monkey-patch getUserMedia BEFORE MindAR loads to request higher resolution -->
  <script>
  (function() {
    const origGUM = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
    navigator.mediaDevices.getUserMedia = function(constraints) {
      if (constraints && constraints.video && typeof constraints.video === 'object') {
        constraints.video.width = { ideal: 1920 };
        constraints.video.height = { ideal: 1080 };
        constraints.video.frameRate = { ideal: 30 };
      } else if (constraints && constraints.video === true) {
        constraints.video = { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30 }, facingMode: 'environment' };
      }
      return origGUM(constraints);
    };
  })();
  </script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: none; }

    #container { width: 100vw; height: 100vh; position: relative; overflow: hidden; }

    /* --- Status banner --- */
    #status {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      z-index: 10; color: #fff; font-size: 16px; text-align: center;
      background: rgba(0,0,0,0.75); padding: 10px 24px; border-radius: 12px;
      pointer-events: none; transition: opacity 0.3s;
    }

    /* --- HUD (HP bars) --- */
    #hud {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      display: none; justify-content: space-between; padding: 50px 16px 0;
      pointer-events: none;
    }
    .hp-wrap { width: 140px; }
    .hp-label { color: #fff; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 4px; }
    .hp-track { height: 10px; border-radius: 5px; background: rgba(255,255,255,0.15); overflow: hidden; }
    .hp-fill { height: 100%; border-radius: 5px; transition: width 0.4s ease-out; }
    .hp-fill.p1 { background: linear-gradient(90deg, #00ff88, #00cc66); }
    .hp-fill.p2 { background: linear-gradient(90deg, #ff4444, #cc0000); }
    .hp-num { color: #ccc; font-size: 10px; margin-top: 2px; text-align: center; font-variant-numeric: tabular-nums; }

    /* --- Turn indicator --- */
    #turn-msg {
      position: fixed; top: 45%; left: 50%; transform: translate(-50%, -50%);
      z-index: 20; color: #fff; font-size: 30px; font-weight: 800;
      text-shadow: 0 0 20px rgba(255,255,255,0.4); pointer-events: none;
      opacity: 0; transition: opacity 0.25s;
    }

    /* --- Skill buttons --- */
    #skills {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
      display: none; padding: 16px 12px 24px; gap: 10px; justify-content: center;
    }
    .skill-btn {
      flex: 1; max-width: 110px; padding: 14px 6px; border: none; border-radius: 14px;
      color: #fff; font-size: 13px; font-weight: 700; cursor: pointer;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5); transition: transform 0.1s, opacity 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .skill-btn:active { transform: scale(0.92); }
    .skill-btn:disabled { opacity: 0.35; pointer-events: none; }
    .skill-btn.fireball { background: linear-gradient(135deg, #ff6600, #ee2200); }
    .skill-btn.ice      { background: linear-gradient(135deg, #0099ff, #0044cc); }
    .skill-btn.ultimate  { background: linear-gradient(135deg, #ffbb00, #ff6600); box-shadow: 0 0 14px rgba(255,170,0,0.35); }
    .skill-dmg { display: block; font-size: 10px; opacity: 0.8; margin-top: 3px; }

    /* --- Game-over overlay --- */
    #game-over {
      position: fixed; inset: 0; z-index: 30; display: none;
      flex-direction: column; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.85);
    }
    #game-over h1 { font-size: 44px; text-shadow: 0 0 30px rgba(255,170,0,0.6); }
    #game-over p  { color: #ccc; font-size: 16px; margin-top: 8px; }

    /* --- Screen flash --- */
    #flash { position: fixed; inset: 0; z-index: 15; pointer-events: none; background: #fff; opacity: 0; transition: opacity 0.1s; }

    /* --- Floating damage numbers --- */
    .dmg-float {
      position: fixed; z-index: 25; font-size: 26px; font-weight: 900;
      text-shadow: 0 0 8px rgba(255,0,0,0.4); pointer-events: none;
      animation: float-up 0.9s ease-out forwards;
    }
    @keyframes float-up {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      60%  { opacity: 1; transform: translateY(-40px) scale(1.1); }
      100% { opacity: 0; transform: translateY(-65px) scale(0.8); }
    }

    /* --- Narration --- */
    #narration {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
      z-index: 15; max-width: 90vw; padding: 10px 20px; border-radius: 10px;
      background: rgba(0,0,0,0.8); color: #ffcc66; font-size: 14px;
      font-style: italic; text-align: center; pointer-events: none;
      opacity: 0; transition: opacity 0.4s;
    }

    /* --- Radial timer --- */
    #radial-timer {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 20; display: none; text-align: center;
    }
    #radial-timer svg { width: 120px; height: 120px; }
    #radial-timer circle { fill: none; stroke-width: 6; stroke-linecap: round;
      transform: rotate(-90deg); transform-origin: center; }
    .timer-track { stroke: #333; }
    .timer-fill { stroke: #ffaa00; stroke-dasharray: 314; stroke-dashoffset: 314;
      transition: stroke-dashoffset 0.1s linear; }
    #radial-label { color: #fff; font-size: 16px; font-weight: 700; margin-top: 8px; }

    /* --- FPS --- */
    #fps {
      position: fixed; bottom: 80px; right: 8px; z-index: 10;
      color: #0f0; font-size: 11px; font-family: monospace; pointer-events: none;
    }

    /* --- Demo mode button --- */
    #demo-btn {
      position: fixed; bottom: 16px; right: 16px; z-index: 15;
      padding: 10px 16px; border: 1px solid #555; border-radius: 8px;
      background: rgba(50,50,50,0.8); color: #aaa; font-size: 12px; font-weight: 600;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    #demo-btn:active { background: rgba(80,80,80,0.9); }

<script type="module">
import * as THREE from 'three';
import { MindARThree } from 'mindar-image-three';

/* ==========================================================
   CONFIG
   ========================================================== */
const TYPE_COLORS = {
  fire:      { primary: '#ff4400', secondary: '#ff8800', glow: '#ff440066' },
  ice:       { primary: '#0099ff', secondary: '#66ccff', glow: '#0099ff66' },
  lightning: { primary: '#ffdd00', secondary: '#ffee66', glow: '#ffdd0066' },
  shadow:    { primary: '#9933ff', secondary: '#cc66ff', glow: '#9933ff66' },
  nature:    { primary: '#00cc44', secondary: '#66ff88', glow: '#00cc4466' },
};

const MAX_HP = 100;

/* ==========================================================
   STATE
   ========================================================== */
let p1HP = MAX_HP, p2HP = MAX_HP;
let started     = false;
let over        = false;
let busy        = false;       // animation lock
let p1Tracked   = false;
let p2Tracked   = false;
let cardsLocked = false;       // once true, monster cards stay in place

const cachedPos = { p1: new THREE.Vector3(), p2: new THREE.Vector3() };
const cachedQuat = { p1: new THREE.Quaternion(), p2: new THREE.Quaternion() };

/* ==========================================================
   DOM
   ========================================================== */
const $ = (s) => document.querySelector(s);
const statusEl = $('#status');
const hudEl    = $('#hud');
const skillsEl = $('#skills');
const turnEl   = $('#turn-msg');
const goEl     = $('#game-over');
const flashEl  = $('#flash');
const fpsEl    = $('#fps');
const demoBtn  = $('#demo-btn');
const muteBtn  = $('#mute-btn');
const playAgainBtn = $('#play-again');
let demoMode   = false;
let ttsEnabled = true;
let demoScriptRunning = false;
const AUTO_DEMO = new URLSearchParams(window.location.search).get('demo') === '1';

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function waitForCondition(pred, timeoutMs = 6000, intervalMs = 50) {
  const t0 = performance.now();
  while (performance.now() - t0 < timeoutMs) {
    if (pred()) return true;
    await sleep(intervalMs);
  }
  return false;
}

async function setupDemoBoard() {
  demoMode = true;
  demoBtn.style.display = 'none';
  console.log('[DEMO] Demo mode activated');
  renderer.setClearColor(0x111111, 1);
  if (mindar.video) mindar.video.style.display = 'none';

  // Place card groups at fixed positions in front of camera
  p1CardGroup.position.set(-0.4, 0.1, -1.2);
  p2CardGroup.position.set(0.4, 0.1, -1.2);

  // Add directly to scene (not to anchors)
  if (p1CardGroup.parent) p1CardGroup.parent.remove(p1CardGroup);
  if (p2CardGroup.parent) p2CardGroup.parent.remove(p2CardGroup);
  scene.add(p1CardGroup);
  scene.add(p2CardGroup);

  // Make them face the camera
  p1CardGroup.lookAt(camera.position);
  p2CardGroup.lookAt(camera.position);

  // Simulate "card placement" with staggered entrance pops
  p1CardGroup.scale.set(0, 0, 0);
  p2CardGroup.scale.set(0, 0, 0);
  p1CardGroup.userData.cardMat.opacity = 0;
  p2CardGroup.userData.cardMat.opacity = 0;
  p1CardGroup.userData.glowMat.opacity = 0;
  p2CardGroup.userData.glowMat.opacity = 0;

  statusEl.style.opacity = '1';
  statusEl.textContent = 'Demo: Place P1 monster card';
  await animEntrance(p1CardGroup);
  await sleep(450);
  statusEl.textContent = 'Demo: Place P2 monster card';
  await animEntrance(p2CardGroup);
  await sleep(300);

  // Set cached positions for projectiles
  p1CardGroup.getWorldPosition(cachedPos.p1);
  p2CardGroup.getWorldPosition(cachedPos.p2);
  p1CardGroup.getWorldQuaternion(cachedQuat.p1);
  p2CardGroup.getWorldQuaternion(cachedQuat.p2);

  cardsLocked = true;
}

async function runDemoScript() {
  if (started || over || demoScriptRunning) return;
  demoScriptRunning = true;
  await setupDemoBoard();
  p1Tracked = true;
  p2Tracked = true;
  beginGame();

  // Wait for combat to be ready, then auto-play the script.
  const ready = await waitForCondition(() => started && !busy && !over && currentPlayer === 1, 5000);
  if (!ready) {
    console.warn('[DEMO] Could not start scripted combat');
    demoScriptRunning = false;
    return;
  }

  // Scripted fight sequence — alternates attacks until KO
  const script = [
    { p: 'p1', slot: 0 },  // P1 basic
    { p: 'p2', slot: 1 },  // P2 special
    { p: 'p1', slot: 2 },  // P1 ultimate
    { p: 'p2', slot: 0 },  // P2 basic
    { p: 'p1', slot: 1 },  // P1 special
    { p: 'p2', slot: 2 },  // P2 ultimate
    { p: 'p1', slot: 0 },  // P1 basic (cleanup)
    { p: 'p2', slot: 1 },  // P2 special (cleanup)
  ];
  const tiers = ['basic', 'special', 'ultimate'];

  for (const step of script) {
    const expectedPlayer = step.p === 'p1' ? 1 : 2;
    const ok = await waitForCondition(() => !busy && !over && currentPlayer === expectedPlayer, 5000);
    if (!ok || over) break;
    await sleep(800);
    const monster = step.p === 'p1' ? DEMO_MONSTERS.p1 : DEMO_MONSTERS.p2;
    const sk = monster.skills[step.slot];
    await attackFromAbilityCard({ tier: tiers[step.slot], name: sk.name, damage: sk.damage });
  }

  demoScriptRunning = false;
}

demoBtn.addEventListener('click', () => {
  if (started || over || demoScriptRunning) return;
  runDemoScript();
});

// Mute toggle
muteBtn.addEventListener('click', () => {
  ttsEnabled = !ttsEnabled;
  muteBtn.textContent = ttsEnabled ? '\u{1F50A}' : '\u{1F507}';
  if (!ttsEnabled) speechSynthesis.cancel();
});

// Play Again
playAgainBtn.addEventListener('click', () => {
  const wasDemo = demoMode || AUTO_DEMO;

  // Reset state
  p1HP = MAX_HP; p2HP = MAX_HP;
  started = false; over = false; busy = false;
  cardsLocked = false; demoMode = false; demoScriptRunning = false;
  currentPlayer = 1; turnCount = 0;
  abilityDetected = null; abilityConfirmed = false;
  speechSynthesis.cancel();

  // Reset UI
  syncHP();
  goEl.style.display = 'none';
  hudEl.style.display = 'none';
  muteBtn.style.display = 'none';
  skillsEl.style.display = 'none';
  statusEl.style.opacity = '1';
  p1Tracked = false; p2Tracked = false;

  // Reset card group visuals
  [p1CardGroup, p2CardGroup].forEach(cg => {
    if (!cg) return;
    scene.remove(cg);
    cg.scale.set(1, 1, 1);
    cg.userData.cardMat.opacity = 1;
    cg.userData.glowMat.opacity = 0.6;
    cg.userData.alive = true;
    updateCardHP(cg, MAX_HP);
  });

  // Reset sprite animators to idle
  if (p1Animator) p1Animator.play('idle');
  if (p2Animator) p2Animator.play('idle');

  if (wasDemo) {
    // Re-run demo — cards go back into scene at fixed positions
    console.log('[GAME] Reset — restarting demo');
    runDemoScript();
  } else {
    // AR mode — re-attach to MindAR anchors, wait for tracking
    statusEl.textContent = 'Point camera at both cards';
    demoBtn.style.display = 'block';
    a0.group.add(p1CardGroup);
    p1CardGroup.position.set(0, 0.1, 0);
    a1.group.add(p2CardGroup);
    p2CardGroup.position.set(0, 0.1, 0);
    console.log('[GAME] Reset — waiting for cards');
  }
});

/* ==========================================================
   MINDAR + THREE SETUP
   ========================================================== */
const mindar = new MindARThree({
  container: $('#container'),
  imageTargetSrc: 'targets/targets.mind',
  maxTrack: 3,
  filterMinCF: 0.0001,
  filterBeta: 0.001,
  missTolerance: 3,
  warmupTolerance: 1,
});

const { renderer, scene, camera } = mindar;

// Lighting
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.5));
const dLight = new THREE.DirectionalLight(0xffffff, 0.8);
dLight.position.set(0, 5, 5);
scene.add(dLight);

/* ==========================================================
   CARD CANVAS RENDERING
   ========================================================== */
const CARD_W = 512, CARD_H = 768;

function drawHPBar(ctx, canvasW, y, hp, maxHP) {
  const barW = canvasW - 80, barH = 18, x = 40;
  const pct = Math.max(0, hp / maxHP);
  // Track
  ctx.fillStyle = '#333';
  ctx.beginPath(); ctx.roundRect(x, y, barW, barH, 9); ctx.fill();
  // Fill
  if (pct > 0) {
    ctx.fillStyle = pct > 0.3 ? '#00cc44' : '#ff3333';
    ctx.beginPath(); ctx.roundRect(x, y, barW * pct, barH, 9); ctx.fill();
  }
  // Text
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 13px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`${Math.max(0, hp)} / ${maxHP}`, canvasW / 2, y + 14);
}

function renderCardCanvas(monster, portraitImg) {
  const c = document.createElement('canvas');
  c.width = CARD_W; c.height = CARD_H;
  const ctx = c.getContext('2d');
  const tc = TYPE_COLORS[monster.type] || TYPE_COLORS.fire;

  // Background
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, CARD_W, CARD_H);

  // Element-colored border
  ctx.strokeStyle = tc.primary;
  ctx.lineWidth = 6;
  ctx.beginPath(); ctx.roundRect(6, 6, CARD_W - 12, CARD_H - 12, 16); ctx.stroke();

  // Portrait area (top half)
  const portY = 24, portH = 340, portW = CARD_W - 48, portX = 24;
  ctx.save();
  ctx.beginPath(); ctx.roundRect(portX, portY, portW, portH, 12); ctx.clip();
  if (portraitImg) {
    // Center-crop the portrait
    const imgAspect = portraitImg.width / portraitImg.height;
    const boxAspect = portW / portH;
    let sx = 0, sy = 0, sw = portraitImg.width, sh = portraitImg.height;
    if (imgAspect > boxAspect) {
      sw = portraitImg.height * boxAspect;
      sx = (portraitImg.width - sw) / 2;
    } else {
      sh = portraitImg.width / boxAspect;
      sy = (portraitImg.height - sh) / 2;
    }
    ctx.drawImage(portraitImg, sx, sy, sw, sh, portX, portY, portW, portH);
  } else {
    // Gradient placeholder in element color
    const grad = ctx.createLinearGradient(portX, portY, portX, portY + portH);
    grad.addColorStop(0, tc.primary + '44');
    grad.addColorStop(1, '#111');
    ctx.fillStyle = grad;
    ctx.fillRect(portX, portY, portW, portH);
    ctx.fillStyle = tc.primary + '66';
    ctx.font = 'bold 48px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('?', CARD_W / 2, portY + portH / 2 + 16);
  }
  // Vignette fade at bottom of portrait
  const vig = ctx.createLinearGradient(0, portY + portH - 80, 0, portY + portH);
  vig.addColorStop(0, 'rgba(17,17,17,0)');
  vig.addColorStop(1, 'rgba(17,17,17,1)');
  ctx.fillStyle = vig;
  ctx.fillRect(portX, portY + portH - 80, portW, 80);
  ctx.restore();

  // Name
  let textY = portY + portH + 28;
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 28px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(monster.name, CARD_W / 2, textY);

  // Type badge
  textY += 22;
  ctx.fillStyle = tc.primary;
  ctx.font = 'bold 14px system-ui, sans-serif';
  ctx.fillText(monster.type.toUpperCase(), CARD_W / 2, textY);

  // Skill columns
  textY += 28;
  const skills = monster.skills || [];
  for (let i = 0; i < skills.length; i++) {
    const sk = skills[i];
    const skY = textY + i * 28;
    // Colored dot
    ctx.fillStyle = sk.color || tc.primary;
    ctx.beginPath(); ctx.arc(60, skY - 4, 5, 0, Math.PI * 2); ctx.fill();
    // Name
    ctx.fillStyle = '#ccc';
    ctx.font = '14px system-ui, sans-serif';
    ctx.textAlign = 'left';
    const label = i === 2 ? sk.name + ' \u2605' : sk.name;
    ctx.fillText(label, 74, skY);
  }

  // HP bar
  const hpY = CARD_H - 50;
  drawHPBar(ctx, CARD_W, hpY, monster.hp, monster.maxHP);

  return c;
}

function makeGlowCanvas(type) {
  const size = 256;
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d');
  const tc = TYPE_COLORS[type] || TYPE_COLORS.fire;
  const grad = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  grad.addColorStop(0, tc.glow);
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);
  return c;
}

/* ==========================================================
   DEMO MONSTERS (pre-cached for reliability)
   ========================================================== */
const DEMO_MONSTERS = {
  p1: {
    name: 'Flimsprite', type: 'shadow', hp: 100, maxHP: 100,
    description: 'Though frail and lacking in power, Flimsprite\'s agility makes it difficult to pin down.',
    skills: [
      { name: 'Mind Slap', color: '#ff69b4', damage: 20, description: 'A quick psychic jab' },
      { name: 'Phase Shift', color: '#cc66ff', damage: 30, description: 'Phases out and counters' },
      { name: 'Astral Burst', color: '#ff44aa', damage: 55, description: 'Devastating psychic nova' },
    ],
    portrait: 'portraits/p1.png',
  },

let p1CardGroup = null, p2CardGroup = null;

function loadPortrait(url) {
  if (!url) return Promise.resolve(null);
  return new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = url;
  });
}

function makeCardGroup(monsterData, portraitImg) {
  const group = new THREE.Group();
  group.position.y = 0.1;

  // Glow plane (behind card)
  const glowCanvas = makeGlowCanvas(monsterData.type);
  const glowTex = new THREE.CanvasTexture(glowCanvas);
  const glowMat = new THREE.MeshBasicMaterial({
    map: glowTex, transparent: true, opacity: 0.6, depthWrite: false,
  });
  const glowPlane = new THREE.Mesh(new THREE.PlaneGeometry(0.72, 1.02), glowMat);
  glowPlane.position.z = -0.005;
  group.add(glowPlane);

  // Card plane
  const cardCanvas = renderCardCanvas(monsterData, portraitImg);
  const cardTex = new THREE.CanvasTexture(cardCanvas);
  cardTex.colorSpace = THREE.SRGBColorSpace;
  const cardMat = new THREE.MeshBasicMaterial({
    map: cardTex, transparent: true, side: THREE.DoubleSide,
  });
  const cardPlane = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.9), cardMat);
  group.add(cardPlane);

  // Sprite overlay (positioned over portrait area of card)
  // Portrait region: y=24..364 on 768h canvas → normalized: top=0.953, bottom=0.526
  // Card plane is 0.6 x 0.9. Portrait occupies ~44% of card height, top portion.
  const spriteH = 0.9 * (340 / 768);  // ~0.399
  const spriteW = 0.6 * (464 / 512);  // ~0.544
  const spriteMat = new THREE.MeshBasicMaterial({
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
  });
  const spritePlane = new THREE.Mesh(new THREE.PlaneGeometry(spriteW, spriteH), spriteMat);
  // Center of portrait in card coords: y offset from card center
  // Card center is 0. Portrait center at (24+170)/768 = 0.253 from top → 0.494 from center (in normalized)
  // In world: 0.9 * (0.5 - 0.253) = 0.222
  spritePlane.position.y = 0.222;
  spritePlane.position.z = 0.002; // slightly in front of card
  group.add(spritePlane);

  group.userData = {
    alive: true,
    cardCanvas, cardTex, cardMat, cardPlane,
    glowPlane, glowMat, spritePlane, spriteMat,
    monsterData, portraitImg,
  };

  return group;
}

function updateCardHP(cardGroup, currentHP) {
  const ud = cardGroup.userData;
  ud.monsterData.hp = currentHP;
  const newCanvas = renderCardCanvas(ud.monsterData, ud.portraitImg);
  ud.cardCanvas = newCanvas;
  ud.cardTex.image = newCanvas;
  ud.cardTex.needsUpdate = true;
}

/* ==========================================================
   SPRITE ANIMATOR
   ========================================================== */
class SpriteAnimator {
  constructor(material, sequences, fps = 10) {
    this.mat = material;           // MeshBasicMaterial with .map
    this.sequences = sequences;    // { idle: [tex,...], cast: [...], hit: [...] }
    this.fps = fps;
    this.current = 'idle';
    this.frame = 0;
    this.elapsed = 0;
    this.loop = true;
    this.onComplete = null;
    this.playing = true;
    if (sequences.idle?.length) {
      this.mat.map = sequences.idle[0];
      this.mat.needsUpdate = true;
    }
  }

  play(name, { loop = true, onComplete = null } = {}) {
    if (!this.sequences[name]?.length) return;
    this.current = name;
    this.frame = 0;
    this.elapsed = 0;
    this.loop = loop;
    this.onComplete = onComplete;
    this.playing = true;
    this.mat.map = this.sequences[name][0];
    this.mat.needsUpdate = true;
  }

  tick(dt) {
    if (!this.playing) return;
    const frames = this.sequences[this.current];
    if (!frames?.length) return;

    this.elapsed += dt;
    const frameDur = 1 / this.fps;
    if (this.elapsed < frameDur) return;
    this.elapsed -= frameDur;

    this.frame++;
    if (this.frame >= frames.length) {
      if (this.loop) {
        this.frame = 0;
      } else {
        this.frame = frames.length - 1;
        this.playing = false;
        if (this.onComplete) this.onComplete();
        // Auto-return to idle
        this.play('idle');
        return;
      }
    }
    this.mat.map = frames[this.frame];
    this.mat.needsUpdate = true;
  }
}

function loadTexture(url) {
  return new Promise(resolve => {
    const loader = new THREE.TextureLoader();
    loader.load(url, tex => {
      tex.colorSpace = THREE.SRGBColorSpace;
      resolve(tex);
    }, undefined, () => resolve(null));
  });
}

async function loadSpriteSequences(monsterKey) {
  const base = `assets/anims/${monsterKey}/`;
  const seqs = { idle: [], cast: [], hit: [] };
  const loads = [];

  // idle: 4 frames
  for (let i = 0; i < 4; i++) loads.push({ seq: 'idle', url: `${base}idle_${i}.png` });
  // cast: 2 frames
  for (let i = 0; i < 2; i++) loads.push({ seq: 'cast', url: `${base}cast_${i}.png` });
  // hit: 2 frames
  for (let i = 0; i < 2; i++) loads.push({ seq: 'hit', url: `${base}hit_${i}.png` });

  const results = await Promise.all(loads.map(l => loadTexture(l.url)));
  loads.forEach((l, i) => { if (results[i]) seqs[l.seq].push(results[i]); });

  console.log(`[SPRITE] ${monsterKey}: idle=${seqs.idle.length} cast=${seqs.cast.length} hit=${seqs.hit.length}`);
  return seqs;
}

a0.onTargetFound = () => { p1Tracked = true;  console.log('[TRACK] P1 Monster FOUND'); onTrack(); };
a0.onTargetLost  = () => { if (!cardsLocked) { p1Tracked = false; console.log('[TRACK] P1 Monster LOST'); onTrack(); } };
a1.onTargetFound = () => { p2Tracked = true;  console.log('[TRACK] P2 Monster FOUND'); onTrack(); };

function onTrack() {
  if (demoMode) return;
  if (p1Tracked && p2Tracked) {
    cachePositions();
    if (!started && !over) beginGame();
  }
  if (!started) {
    if (!p1Tracked && !p2Tracked) statusEl.textContent = 'Point camera at both cards';
    else if (p1Tracked && !p2Tracked) statusEl.textContent = 'P1 found — looking for P2...';
    else if (!p1Tracked && p2Tracked) statusEl.textContent = 'P2 found — looking for P1...';
  }
}

function cachePositions() {
  a0.group.getWorldPosition(cachedPos.p1);
  a1.group.getWorldPosition(cachedPos.p2);
  a0.group.getWorldQuaternion(cachedQuat.p1);
  a1.group.getWorldQuaternion(cachedQuat.p2);
}

async function lockCards() {
  if (cardsLocked) return;
  cachePositions();

  // Detach card groups from MindAR anchors and place in scene at cached world transforms
  a0.group.remove(p1CardGroup);
  a1.group.remove(p2CardGroup);

  p1CardGroup.position.copy(cachedPos.p1);
  p1CardGroup.position.y += 0.1;
  p1CardGroup.quaternion.copy(cachedQuat.p1);

  p2CardGroup.position.copy(cachedPos.p2);
  p2CardGroup.position.y += 0.1;
  p2CardGroup.quaternion.copy(cachedQuat.p2);

  scene.add(p1CardGroup);
  scene.add(p2CardGroup);

  cardsLocked = true;
  console.log('[LOCK] Monster cards locked in place — no longer tracking');

  // Entrance pop animation
  await Promise.all([animEntrance(p1CardGroup), animEntrance(p2CardGroup)]);
  console.log('[LOCK] Entrance animation complete');
}

  a0.group.add(p1CardGroup);
  a1.group.add(p2CardGroup);

  console.log('[INIT] Card groups created');
}

// Maps physical card target index → skill slot (0=basic, 1=special, 2=ultimate)
const ABILITY_SLOT = { 2: 0, 3: 1, 4: 2 };
const ABILITY_TIERS = ['basic', 'special', 'ultimate'];
const CONFIRM_TIME = 2000;
let currentPlayer = 1;
let abilityDetected = null;
let abilityDetectStart = 0;
let abilityConfirmed = false;
let turnCount = 0;

const timerEl = $('#radial-timer');
const timerFill = $('#timer-fill');
const timerLabel = $('#radial-label');

function onAbilityFound(targetIndex) {
  if (demoMode) return;
  if (!started || busy || over || abilityConfirmed) return;
  const slot = ABILITY_SLOT[targetIndex];
  if (slot === undefined) return;
  const monster = currentPlayer === 1 ? DEMO_MONSTERS.p1 : DEMO_MONSTERS.p2;
  const sk = monster.skills[slot];
  const ability = { tier: ABILITY_TIERS[slot], name: sk.name, damage: sk.damage || 25 };
  console.log(`[ABILITY] ${ability.name} detected (target ${targetIndex})`);
  abilityDetected = { ...ability, targetIndex };
  abilityDetectStart = performance.now();
  timerLabel.textContent = ability.name;
  timerFill.style.strokeDashoffset = '314';
  timerEl.style.display = 'block';
}

function onAbilityLost(targetIndex) {
  if (demoMode) return;
  if (!abilityDetected || abilityDetected.targetIndex !== targetIndex) return;
  if (abilityConfirmed) return;
  console.log(`[ABILITY] ${abilityDetected.name} lost`);
  abilityDetected = null;
  timerEl.style.display = 'none';
}

aBasic.onTargetFound   = () => onAbilityFound(2);
aBasic.onTargetLost    = () => onAbilityLost(2);
aSpecial.onTargetFound = () => onAbilityFound(3);
aSpecial.onTargetLost  = () => onAbilityLost(3);
aUlt.onTargetFound     = () => onAbilityFound(4);
aUlt.onTargetLost      = () => onAbilityLost(4);

function tickAbilityTimer(now) {
  if (!abilityDetected || abilityConfirmed || busy || over) return;
  const elapsed = now - abilityDetectStart;
  const pct = Math.min(elapsed / CONFIRM_TIME, 1);
  timerFill.style.strokeDashoffset = String(314 * (1 - pct));
  if (pct >= 1) {
    abilityConfirmed = true;
    timerEl.style.display = 'none';
    attackFromAbilityCard(abilityDetected);
  }
}

async function attackFromAbilityCard(ability) {
  if (busy || over) return;
  busy = true;
  setSkills(false);

  const isP1 = currentPlayer === 1;
  const atkr = isP1 ? p1CardGroup : p2CardGroup;
  const defr = isP1 ? p2CardGroup : p1CardGroup;
  const from = (isP1 ? cachedPos.p1 : cachedPos.p2).clone();
  const to   = (isP1 ? cachedPos.p2 : cachedPos.p1).clone();
  from.y += 0.1;
  to.y   += 0.1;

  // VFX config by tier
  const vfx = {
    basic:   { color: 0xff8800, size: 0.06, duration: 500, flash: false, shake: false },
    special: { color: 0x00ccff, size: 0.08, duration: 450, flash: false, shake: false },
    ultimate:{ color: 0xff44aa, size: 0.15, duration: 700, flash: true,  shake: true  },
  };
  const cfg = vfx[ability.tier];
  const damage = ability.damage;

  console.log(`[COMBAT] P${currentPlayer} plays ${ability.name} (${damage} dmg)`);
  turnCount++;

  await animCast(atkr);

  await new Promise(done => {
    spawnProjectile(from, to, cfg, async () => {
      if (cfg.flash) screenFlash();
      sfxHit(ability.tier);

      if (isP1) p2HP -= damage; else p1HP -= damage;
      console.log(`[HP] P1: ${p1HP}/${MAX_HP} | P2: ${p2HP}/${MAX_HP}`);
      syncHP();
      updateCardHP(defr, isP1 ? p2HP : p1HP);
      dmgNumber(damage, to, cfg.color);

      const atkName = (isP1 ? DEMO_MONSTERS.p1 : DEMO_MONSTERS.p2).name;
      const defName = (isP1 ? DEMO_MONSTERS.p2 : DEMO_MONSTERS.p1).name;
      fetchNarration(ability.name, damage, atkName, defName, isP1 ? p2HP : p1HP, MAX_HP);

      const dead = isP1 ? p2HP <= 0 : p1HP <= 0;
      if (dead) {
        console.log(`[GAME] P${isP1 ? 2 : 1} DEFEATED`);
        sfxDeath();
        await animDeath(defr);
        over = true;
        const winner = isP1 ? DEMO_MONSTERS.p1 : DEMO_MONSTERS.p2;
        const loser  = isP1 ? DEMO_MONSTERS.p2 : DEMO_MONSTERS.p1;
        $('#go-title').textContent = winner.name.toUpperCase() + ' WINS!';
        $('#go-title').style.color = '#ffaa00';
        $('#go-sub').textContent = `${loser.name} has been defeated!`;
        goEl.style.display = 'flex';
      } else {
        await animHit(defr);
      }
      done();
    });
  });

  busy = false;
  abilityDetected = null;
  abilityConfirmed = false;

  if (over) return;

  // Flip turn
  currentPlayer = currentPlayer === 1 ? 2 : 1;
  const monster = currentPlayer === 1 ? DEMO_MONSTERS.p1 : DEMO_MONSTERS.p2;
  flash(`P${currentPlayer}'s Turn`, 800, () => {
    renderSkillButtons(monster);
    setSkills(true);
  });
}

   DYNAMIC SKILL BUTTONS (fallback for non-card play)

function renderSkillButtons(monster) {
  const skills = monster.skills || [];
  const tiers = ['basic', 'special', 'ultimate'];
  const classes = ['fireball', 'ice', 'ultimate'];
  skillsEl.replaceChildren();
  skills.forEach((sk, i) => {
    const dmgVal = sk.damage || 25;
    const btn = document.createElement('button');
    btn.className = 'skill-btn ' + classes[i];

    const dmg = document.createElement('span');

    btn.addEventListener('click', e => {
      e.preventDefault();
      if (busy || over) return;
      attackFromAbilityCard({ tier: tiers[i], name: sk.name, damage: dmgVal });
    });
    skillsEl.appendChild(btn);
  });
}

/* ==========================================================
   SYNTHESIZED SFX (Web Audio API — no external files)
   ========================================================== */
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function sfxFightStart() {
  const ctx = getAudioCtx();
  // Rising sweep + punch
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(200, ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.3);
  gain.gain.setValueAtTime(0.3, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
  osc.connect(gain).connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime + 0.5);
}

function sfxHit(tier) {
  const ctx = getAudioCtx();
  // Noise burst scaled by tier
  const dur = tier === 'ultimate' ? 0.35 : tier === 'special' ? 0.2 : 0.12;
  const vol = tier === 'ultimate' ? 0.4 : tier === 'special' ? 0.25 : 0.15;
  const buf = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(vol, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + dur);
  // Low-pass for deeper thud on ultimate
  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = tier === 'ultimate' ? 600 : tier === 'special' ? 1200 : 2400;
  src.connect(filter).connect(gain).connect(ctx.destination);
  src.start();
}

function sfxDeath() {
  const ctx = getAudioCtx();
  // Descending tone + noise
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(400, ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(60, ctx.currentTime + 0.6);
  gain.gain.setValueAtTime(0.2, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.7);
  osc.connect(gain).connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime + 0.7);
}

/* ==========================================================
   NARRATION
   ========================================================== */
const narrationEl = $('#narration');
let narrationTimer = null;

function fetchNarration(ability, damage, attackerName, defenderName, defenderHP, maxHP) {
  const state = {
    attacker: attackerName,
    defender: defenderName,
    ability: ability,
    damage: damage,
    defenderHP: Math.max(0, defenderHP),
    defenderMaxHP: maxHP,
    ko: defenderHP <= 0,
  };
  fetch('/api/narrate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(state),
  })
    .then(r => r.json())
    .then(d => { if (d.narration) showNarration(d.narration); })
    .catch(() => {});
}

function showNarration(text) {
  clearTimeout(narrationTimer);
  narrationEl.textContent = text;
  narrationEl.style.opacity = '1';
  narrationTimer = setTimeout(() => { narrationEl.style.opacity = '0'; }, 3500);

  // TTS
  if (ttsEnabled && 'speechSynthesis' in window) {
    speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    utt.rate = 1.1;
    utt.pitch = 0.9;
    speechSynthesis.speak(utt);
  }
}

/* ==========================================================
   PROJECTILE SYSTEM
   ========================================================== */
const projectiles = [];

function spawnProjectile(from, to, cfg, onHit) {
  const mat = new THREE.MeshBasicMaterial({ color: cfg.color });
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(cfg.size, 12, 12), mat);
  mesh.position.copy(from);
  scene.add(mesh);

  const glow = new THREE.PointLight(cfg.color, 2, 0.5);
  mesh.add(glow);

  projectiles.push({
    mesh, glow, from: from.clone(), to: to.clone(),
    t0: performance.now(), dur: cfg.duration,
    color: cfg.color, size: cfg.size,
    trails: [], onHit, dead: false,
  });
}

function tickProjectiles(now) {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    if (p.dead) continue;

    const t = Math.min((now - p.t0) / p.dur, 1);
    const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

    p.mesh.position.lerpVectors(p.from, p.to, ease);
    p.mesh.scale.setScalar(1 + 0.2 * Math.sin(t * Math.PI * 8));

    // trail
    if (t < 0.9 && Math.random() < 0.6) {
      const tm = new THREE.Mesh(
        new THREE.SphereGeometry(p.size * 0.25, 6, 6),
        new THREE.MeshBasicMaterial({ color: p.color, transparent: true, opacity: 0.5 })
      );
      tm.position.copy(p.mesh.position);
      scene.add(tm);
      p.trails.push({ m: tm, born: now });
    }

    // fade trails
    for (let j = p.trails.length - 1; j >= 0; j--) {
      const age = (now - p.trails[j].born) / 250;
      if (age >= 1) { dispose(p.trails[j].m); p.trails.splice(j, 1); }
      else { p.trails[j].m.material.opacity = 0.5 * (1 - age); p.trails[j].m.scale.setScalar(1 - age * 0.6); }
    }

    // arrive
    if (t >= 1) {
      dispose(p.mesh);
      p.trails.forEach(tr => dispose(tr.m));
      p.dead = true;
      projectiles.splice(i, 1);
      if (p.onHit) p.onHit();
    }
  }
}

function dispose(mesh) {
  scene.remove(mesh);
  mesh.geometry?.dispose();
  if (mesh.material) mesh.material.dispose?.();
}

/* ==========================================================
   ANIMATIONS (card group versions)
   ========================================================== */
function animCast(cardGroup) {
  // Trigger sprite cast animation
  const anim = cardGroup === p1CardGroup ? p1Animator : p2Animator;
  if (anim) anim.play('cast', { loop: false });

  return new Promise(r => {
    const s0 = cardGroup.scale.clone();
    const t0 = performance.now();
    (function tick() {
      const t = (performance.now() - t0) / 280;
      if (t >= 1) { cardGroup.scale.copy(s0); return r(); }
      const s = 1 + 0.35 * Math.sin(t * Math.PI);
      cardGroup.scale.set(s0.x * s, s0.y * s, s0.z * s);
      requestAnimationFrame(tick);
    })();
  });
}

function animHit(cardGroup) {
  // Trigger sprite hit animation
  const anim = cardGroup === p1CardGroup ? p1Animator : p2Animator;
  if (anim) anim.play('hit', { loop: false });

  return new Promise(r => {
    const { cardMat, glowMat } = cardGroup.userData;
    cardMat.color.set(0xff3333);
    glowMat.opacity = 1.0;
    const p0 = cardGroup.position.clone();
    const t0 = performance.now();
    (function tick() {
      const t = (performance.now() - t0) / 350;
      if (t >= 1) {
        cardMat.color.set(0xffffff);
        glowMat.opacity = 0.6;
        cardGroup.position.copy(p0);
        return r();
      }
      cardGroup.position.x = p0.x + (Math.random() - 0.5) * 0.02;
      cardGroup.position.z = p0.z + (Math.random() - 0.5) * 0.02;
      if (t > 0.5) {
        const f = (t - 0.5) / 0.5;
        cardMat.color.lerp(new THREE.Color(0xffffff), f);
        glowMat.opacity = 1.0 - f * 0.4;
      }
      requestAnimationFrame(tick);
    })();
  });
}

function animDeath(cardGroup) {
  return new Promise(r => {
    cardGroup.userData.alive = false;
    const tc = TYPE_COLORS[cardGroup.userData.monsterData.type] || TYPE_COLORS.fire;
    const particleColor = new THREE.Color(tc.primary);
    const bits = [];
    for (let i = 0; i < 20; i++) {
      const m = new THREE.Mesh(
        new THREE.SphereGeometry(0.015, 6, 6),
        new THREE.MeshBasicMaterial({ color: particleColor, transparent: true, opacity: 1 })
      );
      m.position.copy(cardGroup.position);
      cardGroup.parent.add(m);
      bits.push({
        m,
        v: new THREE.Vector3((Math.random() - 0.5) * 0.5, Math.random() * 0.35, (Math.random() - 0.5) * 0.5),
      });
    }
    const t0 = performance.now();
    (function tick() {
      const t = (performance.now() - t0) / 750;
      if (t >= 1) {
        cardGroup.scale.set(0, 0, 0);
        cardGroup.userData.cardMat.opacity = 0;
        bits.forEach(b => dispose(b.m));
        return r();
      }
      cardGroup.scale.setScalar(1 - t);
      cardGroup.userData.cardMat.opacity = 1 - t;
      cardGroup.userData.glowMat.opacity = 0.6 * (1 - t);
      bits.forEach(b => {
        b.m.position.addScaledVector(b.v, 0.016);
        b.v.y -= 0.006;
        b.m.material.opacity = 1 - t;
      });
      requestAnimationFrame(tick);
    })();
  });
}

/* ==========================================================
   ENTRANCE ANIMATION
   ========================================================== */
function animEntrance(cardGroup) {
  return new Promise(r => {
    cardGroup.scale.set(0, 0, 0);
    cardGroup.userData.cardMat.opacity = 0;
    cardGroup.userData.glowMat.opacity = 0;
    const t0 = performance.now();
    (function tick() {
      const t = Math.min((performance.now() - t0) / 400, 1);
      // Ease-out-back: overshoot then settle
      const c1 = 1.70158;
      const c3 = c1 + 1;
      const ease = 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
      cardGroup.scale.setScalar(ease);
      cardGroup.userData.cardMat.opacity = Math.min(t * 2, 1);
      cardGroup.userData.glowMat.opacity = Math.min(t * 1.5, 0.6);
      if (t >= 1) return r();
      requestAnimationFrame(tick);
    })();
  });
}

/* ==========================================================
   IDLE BOB
   ========================================================== */
function bob(cardGroup, t) {
  if (!cardGroup || !cardGroup.userData.alive) return;
  cardGroup.position.y = 0.1 + Math.sin(t * 2) * 0.008;
  cardGroup.rotation.z = Math.sin(t * 1.5) * 0.02;
  // Glow pulse
  cardGroup.userData.glowMat.opacity = 0.5 + 0.15 * Math.sin(t * 3);
}

/* ==========================================================
   FPS + DEBUG SHORTCUT (tap FPS counter 3x to instant-kill enemy)
   ========================================================== */
let frames = 0, lastFps = performance.now();
let debugTaps = 0, debugTimer = null;
fpsEl.style.pointerEvents = 'auto';
fpsEl.addEventListener('click', () => {
  debugTaps++;
  clearTimeout(debugTimer);
  debugTimer = setTimeout(() => (debugTaps = 0), 800);
  if (debugTaps >= 3 && started && !over) {
    console.log('[DEBUG] Instant kill triggered');
    debugTaps = 0;
    p2HP = 0;
    syncHP();
    updateCardHP(p2CardGroup, 0);
    animDeath(p2CardGroup).then(() => {
      over = true;
      $('#go-title').textContent = 'VICTORY!';
      $('#go-title').style.color = '#ffaa00';
      $('#go-sub').textContent = 'DEBUG: instant kill';
      goEl.style.display = 'flex';
    });
  }
});

/* ==========================================================
   LIVE RELOAD (polls server for file changes)
   ========================================================== */
(function liveReload() {
  let lastMod = null;
  setInterval(async () => {
    try {
      const res = await fetch('/index.html', { method: 'HEAD' });
      const mod = res.headers.get('last-modified');
      if (lastMod && mod !== lastMod) location.reload();
      lastMod = mod;
    } catch {}
  }, 1500);
})();

/* ==========================================================
   MAIN LOOP
   ========================================================== */
async function init() {
  const startRenderLoop = () => {
    renderer.setAnimationLoop(() => {
      const now = performance.now();

      tickProjectiles(now);
      tickAbilityTimer(now);
      bob(p1CardGroup, now / 1000);
      bob(p2CardGroup, now / 1000);

      // Sprite animation tick
      const dt = 1 / 60; // approximate — good enough for sprite FPS
      if (p1Animator) p1Animator.tick(dt);
      if (p2Animator) p2Animator.tick(dt);

      if (p1Tracked && p2Tracked && started && !cardsLocked) cachePositions();

      frames++;
      if (now - lastFps >= 1000) {
        fpsEl.textContent = frames + ' FPS';
        frames = 0;
        lastFps = now;
      }

      renderer.render(scene, camera);
    });
  };

  const initDemoSim = async () => {
    console.log('[INIT] Starting camera-free demo mode');
    statusEl.textContent = 'Preparing demo scene...';
    await initCardGroups();
    renderer.setClearColor(0x111111, 1);
    if (mindar.video) mindar.video.style.display = 'none';
    camera.position.set(0, 0, 0);
    camera.lookAt(0, 0, -1);
    startRenderLoop();
    setTimeout(() => runDemoScript(), 200);
  };

  const initLiveAR = async () => {
    console.log('[INIT] Creating card groups...');
    await initCardGroups();
    console.log('[INIT] Starting MindAR...');
    statusEl.textContent = 'Starting camera...';
    await mindar.start();
    console.log('[INIT] MindAR started, camera active');

    // Enable continuous autofocus if supported
    try {
      const stream = mindar.video.srcObject;
      const [track] = stream.getVideoTracks();
      await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
      console.log('[INIT] Autofocus: continuous');
    } catch (e) {
      console.warn('[INIT] Autofocus not supported:', e.message);
    }

    statusEl.textContent = 'Point camera at both cards';
    startRenderLoop();
  };

  try {
    if (AUTO_DEMO) await initDemoSim();
    else await initLiveAR();
  } catch (err) {
    console.error('MindAR error:', err);
    statusEl.textContent = 'Camera error: ' + (err?.message || 'Camera permission denied. Reload and allow access.');
  }
}

init();
</script>
