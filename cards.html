<!DOCTYPE html>
<html>
<head>
  <title>Awakards - Card Targets</title>
  <style>
    body { margin: 0; background: #111; display: flex; align-items: center; justify-content: center; height: 100vh; gap: 40px; }
    .card { text-align: center; }
    .card img { width: 300px; height: auto; border: 3px solid #333; border-radius: 8px; }
    .card p { color: #888; font-family: sans-serif; font-size: 14px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/band-example/raccoon.png" alt="Card 1">
    <p>Card 1 — Your Monster</p>
  </div>
  <div class="card">
    <img src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/band-example/bear.png" alt="Card 2">
    <p>Card 2 — Enemy</p>
  </div>
</body>
</html>
