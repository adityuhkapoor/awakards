<!DOCTYPE html>
<html>
<head>
  <title>Awakards - AR Target Cards</title>
  <style>
    body { margin: 0; background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 20px; padding: 20px; font-family: 'Segoe UI', system-ui, sans-serif; }
    h1 { color: #ffaa00; font-size: 20px; margin-bottom: 0; }
    .instructions { color: #888; font-size: 13px; text-align: center; max-width: 500px; line-height: 1.5; }
    .cards-row { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; }
    .card { text-align: center; }
    .card img { width: 300px; height: auto; border: 3px solid #333; border-radius: 8px; }
    .card p { color: #888; font-size: 14px; margin-top: 8px; }
    .back-link { color: #ffaa00; font-size: 14px; margin-top: 16px; text-decoration: none; }
    .back-link:hover { text-decoration: underline; }
    @media print { body { background: #fff; } h1, .instructions, .back-link { display: none; } .card img { border-color: #000; } .card p { color: #000; } }
  </style>
</head>
<body>
  <h1>AR Target Cards</h1>
  <p class="instructions">Print these images, cut them out, and place them on the table. Point the phone camera at them during battle — the AR system will detect them and overlay your monsters.</p>
  <div class="cards-row">
    <div class="card">
      <img src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/band-example/raccoon.png" alt="Card 1">
      <p>Card 1 — Player 1</p>
    </div>
    <div class="card">
      <img src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/band-example/bear.png" alt="Card 2">
      <p>Card 2 — Player 2</p>
    </div>
  </div>
  <a href="index.html" class="back-link">Back to Lobby</a>
</body>
</html>
